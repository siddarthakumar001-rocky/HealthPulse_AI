<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HealthPulse AI</title>
    <meta name="description" content="AI-powered health monitoring system with real-time tracking and analytics" />
    <meta name="author" content="HealthPulse AI" />

    <meta property="og:title" content="HealthPulse AI" />
    <meta property="og:description" content="AI-powered health monitoring system with real-time tracking and analytics" />
    <meta property="og:type" content="website" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@HealthPulseAI" />
  </head>

  <body>
    <div id="root"></div>
    <script>
      window.addEventListener('error', function(e) {
        document.body.innerHTML += '<div style="position:fixed;top:0;left:0;z-index:9999;background:red;color:white;padding:20px;width:100%;font-family:monospace;overflow:auto;"><h3>Runtime Error</h3><p>' + e.message + '</p><pre>' + (e.error ? e.error.stack : '') + '</pre></div>';
      });
      window.addEventListener('unhandledrejection', function(e) {
        document.body.innerHTML += '<div style="position:fixed;top:0;left:0;z-index:9999;background:red;color:white;padding:20px;width:100%;font-family:monospace;overflow:auto;"><h3>Unhandled Promise Rejection</h3><p>' + e.reason + '</p></div>';
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
