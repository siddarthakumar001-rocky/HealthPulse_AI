name: HealthPulse Telemetry CI/CD Pipeline

on:
  push:
    branches: [ "main", "develop" ]
    paths:
      - 'telemetry_service/**'
      - '.github/workflows/telemetry-ci-cd.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'telemetry_service/**'

permissions:
  contents: read
  packages: write
  security-events: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/telemetry-service

jobs:
  # ========================================================
  # CI STAGE 1: Build, Test & Coverage
  # ========================================================
  build-and-test:
    name: 1. CI - Build & Test (JDK 21)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./telemetry_service

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Compile & Run Unit Tests with JaCoCo
        run: mvn clean test jacoco:report -B

      - name: Upload Test Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: surefire-and-jacoco-reports
          path: |
            telemetry_service/target/surefire-reports/
            telemetry_service/target/site/jacoco/

  # ========================================================
  # CI STAGE 2: Static Code Security Analysis (SAST)
  # ========================================================
  static-analysis:
    name: 2. CI - Static Analysis (SonarQube)
    needs: build-and-test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./telemetry_service

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Run SonarQube Scanner
        if: env.SONAR_TOKEN != ''
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mvn sonar:sonar \
            -Dsonar.projectKey=${{ github.event.repository.name }}-telemetry \
            -Dsonar.host.url=${{ secrets.SONAR_HOST_URL || 'https://sonarcloud.io' }} \
            -B

  # ========================================================
  # CI STAGE 3: Multi-Stage Containerization & CVE Scan
  # ========================================================
  container-build-and-scan:
    name: 3. CI - Containerize & Trivy Scan
    needs: [build-and-test, static-analysis]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: actions/setup-buildx-action@v3

      - name: Log in to Registry
        if: github.event_name != 'pull_request'
        uses: actions/docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Container Image Locally
        uses: docker/build-push-action@v6
        with:
          context: ./telemetry_service
          load: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan Image for Vulnerabilities (Trivy)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Security Scan to GitHub Security Tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Push Container to Registry
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
        uses: docker/build-push-action@v6
        with:
          context: ./telemetry_service
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha

  # ========================================================
  # CD STAGE 4: Continuous Deployment to Staging Environment
  # ========================================================
  deploy-staging:
    name: 4. CD - Deploy to Staging
    needs: container-build-and-scan
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main'
    environment:
      name: staging
      url: https://staging.healthpulse.internal:8085

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure Kubernetes Credentials
        if: env.KUBECONFIG_DATA != ''
        env:
          KUBECONFIG_DATA: ${{ secrets.KUBECONFIG_DATA }}
        run: |
          mkdir -p $HOME/.kube
          echo "$KUBECONFIG_DATA" | base64 -d > $HOME/.kube/config

      - name: Execute Staging Rolling Rollout & Verification
        run: |
          chmod +x ./telemetry_service/deploy.sh
          # Executes rolling rollout with automatic rollback on failure:
          if [ -f "$HOME/.kube/config" ]; then
            ./telemetry_service/deploy.sh "${{ github.sha }}" "healthpulse-staging"
          else
            echo "Kubernetes credentials simulated for staging dry-run."
          fi

  # ========================================================
  # CD STAGE 5: Continuous Deployment to Production
  # ========================================================
  deploy-production:
    name: 5. CD - Zero-Downtime Production Rollout
    needs: deploy-staging
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://api.healthpulse.internal:8085

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure Kubernetes Credentials
        if: env.KUBECONFIG_DATA != ''
        env:
          KUBECONFIG_DATA: ${{ secrets.KUBECONFIG_DATA }}
        run: |
          mkdir -p $HOME/.kube
          echo "$KUBECONFIG_DATA" | base64 -d > $HOME/.kube/config

      - name: Production Rolling Update with Instant Health Probe & Rollback
        run: |
          chmod +x ./telemetry_service/deploy.sh
          if [ -f "$HOME/.kube/config" ]; then
            ./telemetry_service/deploy.sh "${{ github.sha }}" "healthpulse-production"
          else
            echo "Simulating production rolling update for ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
            echo "Production deployment gate passed."
          fi
